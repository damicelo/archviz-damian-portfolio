name: Deploy A-frame portfolio images

on:
  push:
    paths:
      - '.github/aframe-ready.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and decode portfolio images
        shell: bash
        run: |
          mkdir -p assets/images
          cat .github/aframe-deploy/hero/*.txt | tr -d '\n\r' | base64 -d > assets/images/10-a-frame-dora-frontal-architectural-visualization-c387e39b36.webp
          cat .github/aframe-deploy/living/*.txt | tr -d '\n\r' | base64 -d > assets/images/36-a-frame-cabin-interior-visualization-9054cec975.webp
          cat .github/aframe-deploy/bedroom/*.txt | tr -d '\n\r' | base64 -d > assets/images/11-a-frame-dora-mediterranean-pool-variation-c17b7c2fee.webp
          cat .github/aframe-deploy/outdoor/*.txt | tr -d '\n\r' | base64 -d > assets/images/39-a-frame-covered-outdoor-kitchen-terrace.webp

      - name: Commit decoded images
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/10-a-frame-dora-frontal-architectural-visualization-c387e39b36.webp \
                  assets/images/36-a-frame-cabin-interior-visualization-9054cec975.webp \
                  assets/images/11-a-frame-dora-mediterranean-pool-variation-c17b7c2fee.webp \
                  assets/images/39-a-frame-covered-outdoor-kitchen-terrace.webp
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
          else
            git commit -m 'Update A-frame hero and interior gallery images'
            git push
          fi
