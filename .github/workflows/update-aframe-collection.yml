name: Update A-frame collection homepage

on:
  push:
    paths:
      - '.github/workflows/update-aframe-collection.yml'

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge Dora and Lenart presentation on homepage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('<span data-i18n="cat_dora_v5">A-FRAME · SIGNATURE CABIN DESIGN</span>', '<span>A-FRAME · DORA + LENART · CABIN STUDIES</span>')
          text = text.replace('<strong>A-FRAME DORA</strong>', '<strong>A-FRAME CABIN COLLECTION</strong>')
          text = text.replace('alt="A-Frame Dora frontal architectural visualization"', 'alt="A-frame cabin collection architectural visualization"')
          old = '<img alt="A-Frame Dora Mediterranean pool variation" decoding="async" height="1024" loading="lazy" src="assets/images/11-a-frame-dora-mediterranean-pool-variation-c17b7c2fee.webp" width="1536"/>'
          new = '<img alt="A-frame cabin interior visualization" decoding="async" loading="lazy" src="assets/images/36-a-frame-cabin-interior-visualization-9054cec975.webp"/>'
          text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit homepage update
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Present Dora and Lenart as one A-frame cabin collection"
          git push