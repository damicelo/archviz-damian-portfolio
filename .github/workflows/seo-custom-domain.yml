name: SEO custom domain migration

on:
  push:
    paths:
      - '.github/workflows/seo-custom-domain.yml'

permissions:
  contents: write

jobs:
  migrate-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update SEO URLs and homepage metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = 'https://damicelo.github.io/archviz-damian-portfolio'
          new = 'https://archvizdamian.com'

          files = [Path('index.html')]
          files += sorted(Path('projects').glob('*/index.html'))
          files += sorted(Path('services').glob('*/index.html'))

          for p in files:
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              text = text.replace(old, new)

              if p == Path('index.html'):
                  text = text.replace(
                      '<title>Architectural Visualization &amp; Resort Design | Archviz Damian</title>',
                      '<title>Damijan Koprivc | Architectural Visualization | Archviz Damian</title>'
                  )
                  text = text.replace(
                      '<meta content="Architectural Visualization &amp; Resort Design | Archviz Damian" property="og:title"/>',
                      '<meta content="Damijan Koprivc | Architectural Visualization | Archviz Damian" property="og:title"/>'
                  )
                  text = text.replace(
                      '<meta name="twitter:title" content="Architectural Visualization & Resort Design | Archviz Damian"/>',
                      '<meta name="twitter:title" content="Damijan Koprivc | Architectural Visualization | Archviz Damian"/>'
                  )
                  author = '<meta name="author" content="Damijan Koprivc"/>'
                  if author not in text:
                      marker = '<meta content="#0d0e0e" name="theme-color"/>'
                      text = text.replace(marker, marker + '\n' + author, 1)

              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit SEO migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No SEO changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html projects services
          git commit -m "Migrate SEO metadata to archvizdamian.com"
          git push
